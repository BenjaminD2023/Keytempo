name: Release validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable or beta release tag, matching Info.plist (for example v0.5.0-beta)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and version
        id: version
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          app_version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          # The extractor accepts only numeric SemVer with optional -beta[.N]
          # and requires exactly this release's complete changelog section.
          python3 scripts/release-notes.py CHANGELOG.md "$app_version" > /dev/null
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            print -u2 "Tag $RELEASE_TAG does not match Info.plist version $app_version"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            print -u2 "The checked out commit must match the existing release tag"
            exit 1
          fi
          print "version=$app_version" >> "$GITHUB_OUTPUT"
      - name: Unit tests, Release build and native integration checks
        run: ./scripts/test.sh
      - name: Validate source packaging and architecture
        shell: zsh {0}
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/package-source.sh
          binary_architecture="$(lipo -archs dist/Keytempo.app/Contents/MacOS/Keytempo)"
          if [[ "$binary_architecture" != arm64 ]]; then
            print -u2 "This release job expects an Apple Silicon runner; got $binary_architecture"
            exit 1
          fi
      - name: Local publication required
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<NOTES
          ## Validated $RELEASE_TAG

          Tests, compilation, integration checks and source packaging passed.

          This runner has no stable publisher certificate or Sparkle private key.
          Its temporary ad-hoc build is deliberately **not published** to the update channel.

          On the maintainer Mac, follow docs/RELEASING.md and run
          scripts/publish-release.sh --prepare, review the result, then run
          scripts/publish-release.sh --publish. Commit and push the resulting signed appcast.xml.
          Private keys stay in the local Keychain; no private certificate is exported to GitHub.
          NOTES
