name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m
      - name: Unit tests, Release build and native integration checks
        run: ./scripts/test.sh
      - name: Check source packaging
        run: ./scripts/package-source.sh
